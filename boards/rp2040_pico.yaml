name: Raspberry Pi Pico
mcu: rp2040
frameworks:
  - arduino
description: Raspberry Pi RP2040 microcontroller board

pins:
  # Onboard LED
  LED_BUILTIN: GPIO25

  # GPIO (physical GP pin names)
  GP0:  GPIO0
  GP1:  GPIO1
  GP2:  GPIO2
  GP3:  GPIO3
  GP4:  GPIO4
  GP5:  GPIO5
  GP6:  GPIO6
  GP7:  GPIO7
  GP8:  GPIO8
  GP9:  GPIO9
  GP10: GPIO10
  GP11: GPIO11
  GP12: GPIO12
  GP13: GPIO13
  GP14: GPIO14
  GP15: GPIO15
  GP16: GPIO16
  GP17: GPIO17
  GP18: GPIO18
  GP19: GPIO19
  GP20: GPIO20
  GP21: GPIO21
  GP22: GPIO22
  GP26: GPIO26
  GP27: GPIO27
  GP28: GPIO28

  # Arduino-style D aliases (used by many shields)
  D0:  GPIO0
  D1:  GPIO1
  D2:  GPIO2
  D3:  GPIO3
  D4:  GPIO4
  D5:  GPIO5
  D6:  GPIO6
  D7:  GPIO7
  D8:  GPIO8
  D9:  GPIO9
  D10: GPIO10
  D11: GPIO11
  D12: GPIO12
  D13: GPIO13

  # I2C0 default
  I2C_SDA: GPIO4
  I2C_SCL: GPIO5
  SDA:     GPIO4
  SCL:     GPIO5

  # SPI0 default
  SPI_MOSI: GPIO3
  SPI_MISO: GPIO4
  SPI_SCK:  GPIO2
  SPI_CS:   GPIO5
  MOSI:     GPIO3
  MISO:     GPIO4
  SCK:      GPIO2

  # UART0 default
  TX0: GPIO0
  RX0: GPIO1

  # Analog inputs (ADC0-ADC2)
  A0: GPIO26
  A1: GPIO27
  A2: GPIO28

pin_caps:
  # Internal — not broken out on the header; connected to SMPS and VBUS circuits
  GPIO23: [internal]   # RT6150 PS pin (SMPS power-save mode)
  GPIO24: [internal]   # VBUS detect (USB connector, read-only from user perspective)

defaults:
  i2c_frequency: 100000
  spi_frequency: 1000000
  uart_baud: 115200
