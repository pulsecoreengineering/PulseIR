# Parameters become writable MQTT setpoints, carrying their unit and range so
# a dashboard can render a bounded control.

system:
  parameters:
    - name: temp_setpoint
      type: float
      default: 26.0
      unit: degC
      min: 10.0
      max: 40.0
      description: Target air temperature

    - name: hysteresis
      type: float
      default: 1.5
      unit: degC
      min: 0.1
      max: 5.0
      description: Band around the setpoint before venting

    - name: sample_interval
      type: int
      default: 5000
      unit: ms
      min: 500
      max: 60000
      description: How often to sample the climate
