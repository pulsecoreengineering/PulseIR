# Buses, devices and third-party libraries.
#
# Only libraries the platform does not imply need declaring: Wire, SPI and
# WiFi come with the interfaces below.

libraries:
  - name: Adafruit_BME280
    include: Adafruit_BME280.h
    version: "^2.2"
    source: registry
    description: Temperature, humidity and pressure over I2C

hardware:
  buses:
    sensor_bus:
      interface: i2c
      sda: GPIO21
      scl: GPIO22
      frequency: 400000
      library: Adafruit_BME280
      description: Shared I2C bus for climate sensors

    card_slot:
      interface: spi
      sck: GPIO18
      miso: GPIO19
      mosi: GPIO23
      cs: GPIO5
      description: SD card for offline logging

    gps:
      interface: uart
      port: 2
      baud: 9600
      rx: GPIO16
      tx: GPIO17

    vent_drive:
      interface: pwm
      pin: GPIO25
      channel: 0
      frequency: 5000
      resolution: 8

    uplink:
      interface: wifi
      ssid: greenhouse-ap
      hostname: greenhouse-01

    broker:
      interface: mqtt
      host: mqtt.example.local
      port: 8883
      tls: true

  devices:
    air_temp:
      type: bme280
      bus: sensor_bus
      address: 0x76
      unit: degC

    humidity:
      type: bme280
      bus: sensor_bus
      address: 0x76
      unit: percent

    vent:
      type: pwm_output
      pin: GPIO25
      channel: 0

    pump:
      type: digital_output
      pin: GPIO26
