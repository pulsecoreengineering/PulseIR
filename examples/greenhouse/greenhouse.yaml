# Multi-file model. Only this file declares `project`.
#
#   hardware.yaml    buses and devices
#   parameters.yaml  tunable configuration
#   machine.yaml     events, states and transitions
#
# Paths are relative to this file. Each name may only be defined once across
# the whole model, so two files cannot silently collide.

project:
  name: greenhouse
  version: "1.0"
  description: Climate control for a small greenhouse

target:
  board: esp32

imports:
  - hardware.yaml
  - parameters.yaml
  - machine.yaml
