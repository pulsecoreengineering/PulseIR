system:
  events:
    - name: START
      source: external
      description: Local start button

    - name: STOP
      source: external

    - name: SAMPLE_DUE
      source: timer
      description: Sampling interval elapsed

    - name: TOO_HOT
      source: sensor

    - name: RECOVERED
      source: sensor

    - name: SENSOR_FAULT
      source: internal

    # Declaring the source as mqtt is what makes this remotely triggerable;
    # the topic manifest exposes only these.
    - name: REMOTE_START
      source: mqtt
      description: Start requested from the dashboard
