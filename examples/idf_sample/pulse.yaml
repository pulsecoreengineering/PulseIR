pulseir: "1"

project:
  name: idf_sample
  version: "1.0"
  description: ESP-IDF sample — blink + serial console + two-state machine

target:
  board: esp32

hardware:
  buses:
    console: { interface: uart, port: 0, baud: 115200 }
  devices:
    led:       { type: digital_output, pin: LED_BUILTIN }
    motor_en:  { type: pwm_output,     pin: GPIO25 }
    motor_in1: { type: digital_output, pin: GPIO26 }
    motor_in2: { type: digital_output, pin: GPIO27 }

parameters:
  blink_ms: { type: int, default: 500, range: [100, 5000], unit: ms }
  speed_rpm: { type: int, default: 0, range: [0, 500], unit: rpm }

events:
  START: { source: external }
  STOP:  { source: external }

actions:
  led_on:      { driver: gpio_control,  params: { device: led, value: HIGH } }
  led_off:     { driver: gpio_control,  params: { device: led, value: LOW  } }
  apply_speed: { driver: custom,        params: { device: motor, value: speed_rpm } }
  show_help:   { driver: console_print, params: { message: "Commands: start, stop, set_speed <rpm>, help" } }

machine:
  initial: idle
  states:
    idle:
    blinking:
  transitions:
    - { from: idle,     on: START, to: blinking, do: led_on  }
    - { from: blinking, on: STOP,  to: idle,     do: led_off }

commands:
  source: console
  map:
    start:     { event: START }
    stop:      { event: STOP  }
    set_speed: apply_speed
    help:      show_help
