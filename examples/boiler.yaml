project:
  name: boiler_control
  version: 1.0
  description: Simple boiler temperature control system

system:
  name: boiler_system
  description: Controls heating, cooling, and monitoring

  # Events the system responds to
  events:
    - name: START
      source: external
      description: User presses start button

    - name: STOP
      source: external
      description: User presses stop button

    - name: TEMP_REACHED
      source: sensor
      description: Temperature sensor indicates setpoint reached

    - name: OVER_TEMP
      source: sensor
      description: Temperature exceeds safety limit

    - name: EMERGENCY_STOP
      source: external
      description: Emergency stop button pressed

  # States the system can be in
  states:
    - name: idle
      type: simple
      description: System is off

    - name: running
      type: composite
      initial: heating
      description: System is actively heating/cooling
      regions:
        - initial: heating
          states:
            - name: heating
              type: simple
            - name: maintaining
              type: simple
            - name: cooling
              type: simple

    - name: fault
      type: simple
      description: System in fault state

  # Transitions between states
  transitions:
    # Idle -> Running
    - source: idle
      event: START
      target: running
      actions:
        - start_pump
      description: Start the system

    # Running -> Idle
    - source: running
      event: STOP
      target: idle
      actions:
        - stop_pump
      description: Stop the system

    # Heating -> Maintaining
    - source: running/heating
      event: TEMP_REACHED
      guard:
        type: expression
        expression: "temperature >= setpoint"
      target: running/maintaining
      actions:
        - reduce_heat
      description: Temperature reached, switch to maintaining

    # Maintaining -> Cooling (if temp overshoots)
    - source: running/maintaining
      event: OVER_TEMP
      guard:
        type: expression
        expression: "temperature > max_safe_temp"
      target: running/cooling
      actions:
        - activate_cooling
      description: Temperature too high, cool down

    # Emergency stop from anywhere
    - source: "*"
      event: EMERGENCY_STOP
      target: fault
      actions:
        - shutdown_all
      description: Emergency stop overrides everything

  # Actions that can be triggered
  actions:
    start_pump:
      type: driver
      driver: gpio_control
      params:
        pin: PUMP
        value: HIGH

    stop_pump:
      type: driver
      driver: gpio_control
      params:
        pin: PUMP
        value: LOW

    reduce_heat:
      type: driver
      driver: pwm_control
      params:
        pin: HEATER
        value: 25

    activate_cooling:
      type: driver
      driver: gpio_control
      params:
        pin: COOLING_FAN
        value: HIGH

    shutdown_all:
      type: driver
      driver: shutdown
      params:
        all: true

  # Components in the system
  components:
    - name: temperature_sensor
      class: sensor
      driver: ds18b20
      config:
        interface: onewire
        pin: GPIO4
      description: Water temperature sensor

    - name: pump
      class: actuator
      driver: gpio_control
      config:
        pin: GPIO25
      description: Main circulation pump

    - name: heater
      class: actuator
      driver: pwm_control
      config:
        pin: GPIO27
      description: Heating element (PWM controlled)

    - name: cooling_fan
      class: actuator
      driver: gpio_control
      config:
        pin: GPIO32
      description: Emergency cooling fan

  # Hardware resources
  resources:
    - name: onewire_bus
      interface: onewire
      binding:
        pin: GPIO4
      description: OneWire bus for temperature sensor

    - name: gpio_pins
      interface: gpio
      description: GPIO pins used throughout

    - name: pwm_channels
      interface: gpio
      binding:
        mode: pwm
      description: PWM channels for heater control

  # System parameters (configuration)
  parameters:
    - name: setpoint
      type: float
      default: 60.0
      unit: degC
      min: 10.0
      max: 90.0
      description: Target temperature

    - name: max_safe_temp
      type: float
      default: 75.0
      unit: degC
      description: Emergency shutdown temperature

    - name: hysteresis
      type: float
      default: 2.0
      unit: degC
      description: Temperature tolerance band
