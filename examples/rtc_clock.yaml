# Real-time clock on an I2C LCD — no manual C required.
#
# Both the DS3231 RTC and the LCD share the same I2C bus. The model:
#   1. Declares the shared bus once, with SDA/SCL pins.
#   2. Declares the DS3231 as a sensor with explicit channels: [hour, minute, second].
#      These channel names are what you reference in format strings below.
#   3. Uses `driver: lcd_display` with {device.channel} refs —
#      {clock.hour} means "the hour channel of the clock device".
#      The codegen produces %02d / snprintf automatically.
#
# A single task fires every second: read the clock, then update the display.
# No guards, no state machine, no C to write.

pulseir: "1"

project:
  name: rtc_clock
  version: "1.0"
  description: DS3231 RTC time displayed on a 16×2 I2C LCD

target: esp32

hardware:
  buses:
    i2c_bus:
      interface: i2c
      sda: GPIO21
      scl: GPIO22
      frequency: 400000

  devices:
    # DS3231 real-time clock.
    # channels: lists the values this device exposes. These names are
    # what you use in {device.channel} format refs — {clock.hour} etc.
    clock:
      type: ds3231
      bus: i2c_bus
      channels: [hour, minute, second]

    # 16×2 I2C character LCD (PCF8574 backpack at 0x27).
    display:
      type: lcd_i2c
      bus: i2c_bus
      address: 0x27
      cols: 16
      rows: 2

actions:
  read_time:
    driver: rtc_read
    params:
      device: clock

  show_time:
    driver: lcd_display
    params:
      device: display
      # {clock.hour} = the `hour` channel of the `clock` device declared above.
      # RTC channels are zero-padded integers (%02d) — codegen handles that.
      lines:
        - format: "Time: {clock.hour}:{clock.minute}:{clock.second}"
          row: 0
          col: 0

tasks:
  clock_tick:
    every: 1000
    do: [read_time, show_time]
    description: Read the RTC and refresh the display every second
