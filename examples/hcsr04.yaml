pulseir: "1"

project:
  name: hcsr04_demo

target: esp32

# Load the HC-SR04 driver plugin so PulseIR emits real hardware code
# instead of a TODO stub. The path is relative to this file.
plugins:
  - ../custom_drivers/hcsr04_read.yaml

hardware:
  devices:
    trig:
      type: digital_output
      pin: GPIO5       # trigger output

    distance:
      type: digital_input
      pin: GPIO18      # echo input — systemSensors.distance holds the cm reading

parameters:
  alert_cm:
    type: float
    default: 30.0
    unit: cm

actions:
  measure_distance:
    driver: hcsr04_read
    params:
      trigger: trig    # {trigger} -> "trig"  / {trigger_pin} -> TRIG_PIN
      echo: distance   # {echo}    -> "distance" / {echo_pin} -> DISTANCE_PIN

# Simple task-only model — no state machine required.
# The measurement runs every 250 ms; your application code reads
# systemSensors.distance and systemParameters.alert_cm as needed.
tasks:
  poll:
    every: 250
    do: [measure_distance]
