# Fixture exercising the parts of the IR the boiler example does not reach:
#   - entering a composite state descends to its initial child (recursively)
#   - a transition on an enclosing state applies to nested children
#   - an inner transition outranks an enclosing one on the same event
#   - a transition may carry several actions
#   - the bare `guard: <name>` shorthand (boiler covers the mapping form)

project:
  name: hierarchy_test
  version: "1.0"
  description: Hierarchy and dispatch semantics fixture

events:
  GO:
    source: external
  NEXT:
    source: internal
  ABORT:
    source: external
  BLOCKED:
    source: internal

machine:
  states:
    off:
    active:
      initial: phase_one
      states:
        phase_one:
        # Nested two levels deep, so entry has to descend more than once.
        phase_two:
          initial: deep
          states:
            deep:
    halted:

  transitions:
    # Target is composite: entry must land on active/phase_one.
    - from: off
      on: GO
      to: active
      do: [log_start, arm_system]

    # Target is composite and nested: entry must land on active/phase_two/deep.
    - from: phase_one
      on: NEXT
      to: phase_two

    # Enclosing source: applies while any descendant of active is current.
    - from: active
      on: ABORT
      to: halted

    # Inner source on the same event: must outrank the `active` transition
    # whenever phase_one is the current state.
    - from: phase_one
      on: ABORT
      to: off

    # Named guard; the generated stub returns false, so this stays blocked.
    - from: phase_one
      on: BLOCKED
      to: halted
      guard: never_ready
