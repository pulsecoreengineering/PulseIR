<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseIR Editor</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f7f9;
    --border: #d9dde3;
    --text: #16191d;
    --dim: #6b7280;
    --accent: #0b6bcb;
    --ok-bg: #e7f5ec;
    --ok-fg: #10603a;
    --err-bg: #fdeaea;
    --err-fg: #97231f;
    --warn-bg: #fdf3e2;
    --warn-fg: #7a4b06;
    --code: #f3f4f6;
    --info-bg: #eef3fb;
    --info-fg: #1a4fa0;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sel: rgba(11, 107, 203, .20);

    --y-key: #0a5ea8;
    --y-string: #9b3b16;
    --y-number: #7b3aa8;
    --y-comment: #6b7280;
    --y-anchor: #10603a;

    --header-h: 46px;
    --bar-h: 36px;
  }
  /* Dark vars shared between the media query and the explicit data-theme toggle */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --panel: #1b1f26; --border: #2c323c;
      --text: #e6e8eb; --dim: #98a1ae; --accent: #62aaf5;
      --ok-bg: #12281d; --ok-fg: #7fd4a4;
      --err-bg: #2e1618; --err-fg: #f6a6a2;
      --warn-bg: #2c2313; --warn-fg: #e9c07a;
      --info-bg: #1a2640; --info-fg: #89b4f8;
      --code: #10131a; --sel: rgba(98, 170, 245, .26);
      --y-key: #7cc0ff; --y-string: #e8a87c; --y-number: #d3a2f0;
      --y-comment: #7d8794; --y-anchor: #7fd4a4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c; --panel: #1b1f26; --border: #2c323c;
    --text: #e6e8eb; --dim: #98a1ae; --accent: #62aaf5;
    --ok-bg: #12281d; --ok-fg: #7fd4a4;
    --err-bg: #2e1618; --err-fg: #f6a6a2;
    --warn-bg: #2c2313; --warn-fg: #e9c07a;
    --info-bg: #1a2640; --info-fg: #89b4f8;
    --code: #10131a; --sel: rgba(98, 170, 245, .26);
    --y-key: #7cc0ff; --y-string: #e8a87c; --y-number: #d3a2f0;
    --y-comment: #7d8794; --y-anchor: #7fd4a4;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #f6f7f9; --border: #d9dde3;
    --text: #16191d; --dim: #6b7280; --accent: #0b6bcb;
    --ok-bg: #e7f5ec; --ok-fg: #10603a;
    --err-bg: #fdeaea; --err-fg: #97231f;
    --warn-bg: #fdf3e2; --warn-fg: #7a4b06;
    --info-bg: #eef3fb; --info-fg: #1a4fa0;
    --code: #f3f4f6; --sel: rgba(11, 107, 203, .20);
    --y-key: #0a5ea8; --y-string: #9b3b16; --y-number: #7b3aa8;
    --y-comment: #6b7280; --y-anchor: #10603a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  }

  /* ── Header ────────────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px; height: var(--header-h);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }

  .brand {
    display: flex; align-items: center; gap: 7px;
    margin-right: 4px; flex-shrink: 0;
  }
  .brand-icon {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 13px; font-weight: 700;
    letter-spacing: -.5px; flex-shrink: 0;
  }
  .brand-name {
    font-size: 14px; font-weight: 600; letter-spacing: -.01em;
    color: var(--text);
  }
  .brand-name span { color: var(--dim); font-weight: 400; }

  .vsep {
    width: 1px; background: var(--border); height: 20px;
    flex-shrink: 0; margin: 0 2px;
  }
  .spacer { flex: 1; }

  /* ── Controls ───────────────────────────────────────────────────────────── */
  label { color: var(--dim); font-size: 12px; white-space: nowrap; }
  select, input, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px;
  }
  button { cursor: pointer; transition: color .12s, border-color .12s, background .12s; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }

  /* Board selector glows amber when unset — impossible to miss */
  #board.unset { border-color: var(--warn-fg); color: var(--warn-fg); }

  /* Theme toggle — icon-only button, no border at rest */
  #theme-button {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0;
    border-color: transparent; background: transparent; border-radius: 6px;
    color: var(--dim); flex-shrink: 0;
  }
  #theme-button:hover:not(:disabled) {
    border-color: var(--border); color: var(--text);
  }
  #theme-button svg { display: block; }

  /* Project / example selectors */
  #project-button {
    font-family: var(--mono); font-size: 12.5px; max-width: 24ch;
    padding: 4px 10px;
  }
  #project-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .caret { color: var(--dim); }
  #example { max-width: 22ch; }

  /* ── Dropdown menus ─────────────────────────────────────────────────────── */
  .menu-host { position: relative; }
  .menu {
    position: absolute; top: calc(100% + 5px); left: 0; z-index: 20;
    min-width: 220px; max-height: 70vh; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 4px;
  }
  /* Download menu aligns to right edge of its button */
  #download-menu { left: auto; right: 0; min-width: 210px; }
  .menu button {
    display: flex; width: 100%; gap: 8px; align-items: baseline;
    border: 0; background: transparent; text-align: left;
    padding: 7px 10px; border-radius: 6px; font-size: 13px;
  }
  .menu button:hover:not(:disabled) { background: var(--panel); color: var(--text); }
  .menu button .sub { color: var(--dim); font-size: 11.5px; margin-left: auto; }
  .menu .sep { height: 1px; background: var(--border); margin: 4px 2px; }
  .menu .heading {
    padding: 6px 10px 2px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--dim);
  }
  .menu button.current { color: var(--accent); font-weight: 600; }
  .menu button.danger:hover { background: var(--err-bg); color: var(--err-fg); }

  /* ── Main layout ────────────────────────────────────────────────────────── */
  main {
    flex: 1; display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    min-height: 0;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }

  .side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .side + .side { border-left: 2px solid var(--border); }
  @media (max-width: 900px) {
    .side + .side { border-left: 0; border-top: 2px solid var(--border); }
  }

  /* ── Bars (file bar + output tab bar) ───────────────────────────────────── */
  .bar {
    display: flex; gap: 4px; align-items: center;
    padding: 0 8px; height: var(--bar-h);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }

  /* File tabs */
  .filebar { gap: 4px; }
  .filetabs {
    display: flex; gap: 2px; overflow-x: auto;
    min-width: 0; flex: 1 1 auto; scrollbar-width: none;
    align-items: center;
  }
  .filetabs::-webkit-scrollbar { display: none; }
  .filebar > button { flex: 0 0 auto; white-space: nowrap; font-size: 12px; padding: 3px 9px; }
  .filetab {
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    border: 1px solid transparent; background: transparent; color: var(--dim);
    padding: 3px 9px; border-radius: 5px; font-size: 12px;
    font-family: var(--mono); cursor: pointer; flex-shrink: 0;
  }
  .filetab:hover { color: var(--text); }
  .filetab.active { background: var(--bg); color: var(--text); border-color: var(--border); }
  .entry-badge { color: var(--accent); font-size: 10px; }
  .filetab .close { color: var(--dim); font-size: 14px; line-height: 1; padding: 0 1px; }
  .filetab .close:hover { color: var(--err-fg); }

  /* Output tabs — underline style for a different visual register */
  .outtabs {
    display: flex; align-items: stretch; gap: 0;
    height: 100%; margin-right: 4px;
  }
  .tab {
    border: 0; background: transparent; color: var(--dim);
    padding: 0 13px; font-size: 13px; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .12s, border-color .12s;
    white-space: nowrap;
  }
  .tab:hover:not(:disabled) { color: var(--text); border-color: var(--border); background: transparent; }
  .tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--accent); }

  /* Namespace input — shown only on the Topics tab */
  #namespace-label { color: var(--dim); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  #namespace { width: 13ch; font-size: 12px; padding: 3px 7px; flex-shrink: 0; }

  /* Download button: accent when output exists */
  #download-button { font-size: 12px; padding: 3px 9px; flex-shrink: 0; }
  #download-button.ready {
    color: var(--accent); border-color: var(--accent);
  }
  #download-button.ready:hover {
    background: var(--accent); color: #fff;
  }

  /* Copy buttons */
  #copy-yaml, #copy-output { font-size: 12px; padding: 3px 9px; flex-shrink: 0; }
  button.copied { color: var(--ok-fg) !important; border-color: var(--ok-fg) !important; }

  /* ── Editor ─────────────────────────────────────────────────────────────── */
  .editor {
    flex: 1; position: relative; min-height: 0; background: var(--bg);
  }
  .editor-text {
    margin: 0; border: 0;
    padding: 12px 14px;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    tab-size: 2; white-space: pre; word-wrap: normal; overflow-wrap: normal;
    letter-spacing: normal;
  }
  #source, #highlight {
    position: absolute; inset: 0; width: 100%; height: 100%;
    box-sizing: border-box;
    padding-left: var(--gutter-width, 14px);
  }

  #gutter {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: var(--gutter-width, 0); overflow: hidden;
    padding-left: 0; padding-right: 10px; text-align: right;
    color: var(--dim); opacity: .65; background: var(--bg);
    border-right: 1px solid var(--border); pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  #gutter .ln { display: block; }
  #gutter .ln.bad {
    color: var(--err-fg); opacity: 1; font-weight: 600;
    background: var(--err-bg);
  }
  #highlight {
    overflow: hidden; pointer-events: none; color: var(--text);
  }
  #highlight code, #gutter-lines {
    display: block; font: inherit; line-height: inherit; letter-spacing: inherit;
    white-space: inherit; tab-size: inherit; color: inherit;
    will-change: transform;
  }
  textarea#source {
    resize: none; outline: none; background: transparent;
    color: transparent; caret-color: var(--text); overflow: auto;
  }
  #source::selection { background: var(--sel, rgba(120,160,255,.28)); }

  /* Syntax colours */
  .y-key     { color: var(--y-key); }
  .y-string  { color: var(--y-string); }
  .y-number  { color: var(--y-number); }
  .y-boolean { color: var(--y-number); }
  .y-null    { color: var(--y-number); }
  .y-comment { color: var(--y-comment); font-style: italic; }
  .y-punct   { color: var(--dim); }
  .y-anchor  { color: var(--y-anchor); }
  .y-tag     { color: var(--y-anchor); }

  /* ── Output panes ───────────────────────────────────────────────────────── */
  .panes { flex: 1; overflow: auto; min-height: 0; }
  .stale-note {
    position: sticky; top: 0; z-index: 1;
    padding: 6px 14px; font-size: 12.5px;
    background: var(--err-bg); color: var(--err-fg);
    border-bottom: 1px solid var(--border);
  }
  .pane { padding: 14px 16px; }
  .pane.stale { opacity: .45; }
  pre { margin: 0; }
  .pane pre code {
    display: block; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.5; white-space: pre; color: var(--text);
  }
  code { font-family: var(--mono); font-size: 12.5px; }

  /* Empty state shown when there is no output yet */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; min-height: 200px;
    color: var(--dim); font-size: 13px; text-align: center; gap: 8px;
    padding: 24px;
  }
  .empty-state .icon { font-size: 32px; opacity: .5; }
  .empty-state p { margin: 0; }

  /* Getting-started guide shown when the model is valid but empty */
  .guide { padding: 20px 20px 24px; max-width: 560px; }
  .guide-title {
    font-size: 15px; font-weight: 600; margin: 0 0 4px;
    color: var(--info-fg);
  }
  .guide-sub { font-size: 13px; color: var(--dim); margin: 0 0 18px; }
  .guide-cards { display: flex; flex-direction: column; gap: 10px; }
  .guide-card {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; background: var(--bg);
    display: grid; grid-template-columns: auto 1fr; gap: 0 14px;
    align-items: start;
  }
  .guide-card-icon {
    grid-row: 1 / 3; align-self: center;
    color: var(--dim);
    width: 22px; height: 22px; flex-shrink: 0;
  }
  .guide-card-icon svg { display: block; }
  .guide-card-label {
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    color: var(--text); margin: 0 0 2px;
  }
  .guide-card-desc { font-size: 12.5px; color: var(--dim); margin: 0; }
  .guide-hint {
    font-size: 12px; color: var(--dim); margin: 16px 0 0;
    display: flex; align-items: center; gap: 6px;
  }
  .guide-hint kbd {
    font-family: var(--mono); font-size: 11px;
    border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; background: var(--panel); color: var(--text);
  }

  /* ── Status bar ─────────────────────────────────────────────────────────── */
  .status {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    padding: 6px 14px; border-top: 1px solid var(--border);
    font-size: 12.5px; flex-shrink: 0;
  }
  .status.ok   { background: var(--ok-bg);   color: var(--ok-fg); }
  .status.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .status.error { background: var(--err-bg); color: var(--err-fg); }
  .status.info { background: var(--info-bg); color: var(--info-fg); }
  .status strong { font-size: 13px; }
  .status span { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }

  /* ── Structure view ─────────────────────────────────────────────────────── */
  h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dim); margin: 18px 0 6px; font-weight: 600;
  }
  h3:first-child { margin-top: 0; }
  .hint { color: var(--dim); font-size: 12.5px; margin: 0 0 10px; }
  .dim { color: var(--dim); }

  .state {
    border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 10px; margin: 5px 0; background: var(--bg);
  }
  .state.composite { background: var(--panel); }
  .state.leaf { display: flex; gap: 7px; align-items: center; }
  .state-name { display: flex; gap: 7px; align-items: center; font-weight: 500; }
  .children { margin: 6px 0 2px 14px; border-left: 2px solid var(--border); padding-left: 10px; }
  .initial { color: var(--accent); font-weight: 700; }
  .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px;
  }
  .tag.wild { color: var(--accent); border-color: var(--accent); }
  .tag.timer { color: var(--warn, var(--dim)); }
  .arrow { color: var(--accent); }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td {
    text-align: left; padding: 5px 8px;
    border-bottom: 1px solid var(--border); vertical-align: top;
  }
  th {
    color: var(--dim); font-weight: 500;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
  }

  /* ── Drag-and-drop overlay ──────────────────────────────────────────────── */
  body.dropping::after {
    content: 'Drop a model folder or .zip to import';
    position: fixed; inset: 12px; z-index: 50; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--accent); border-radius: 12px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    color: var(--accent); font-size: 15px;
  }
</style>
</head>
<body>

<header>
  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon">Pi</div>
    <span class="brand-name">PulseIR <span>editor</span></span>
  </div>

  <div class="vsep"></div>

  <!-- Project -->
  <div class="menu-host">
    <button id="project-button" aria-haspopup="true" aria-expanded="false">
      <span id="project-name">—</span> <span class="caret">▾</span>
    </button>
    <div class="menu" id="project-menu" hidden></div>
  </div>

  <div class="vsep"></div>

  <!-- Board selector -->
  <label for="board">Board</label>
  <select id="board" title="Target board — affects PWM API, pin validation, and board-specific code hints">
    <option value="">— select —</option>
    <optgroup label="ESP32">
      <option value="esp32">ESP32</option>
      <option value="esp32s3">ESP32-S3</option>
      <option value="esp32s2">ESP32-S2</option>
      <option value="esp32c3">ESP32-C3</option>
      <option value="esp32h2">ESP32-H2</option>
    </optgroup>
    <optgroup label="AVR">
      <option value="uno">Arduino Uno</option>
      <option value="mega">Arduino Mega</option>
      <option value="nano">Arduino Nano</option>
    </optgroup>
    <optgroup label="Other">
      <option value="rp2040">RP2040 / Pico</option>
      <option value="esp8266">ESP8266</option>
    </optgroup>
  </select>

  <div class="spacer"></div>

  <!-- Examples -->
  <label for="example">Load example</label>
  <select id="example"><option value="">— choose —</option></select>

  <!-- Theme toggle: cycles auto → light → dark → auto -->
  <button id="theme-button" title="Toggle theme (auto / light / dark)" aria-label="Toggle theme">
    <!-- icon is replaced by JS -->
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <circle cx="8" cy="8" r="6"/>
      <path d="M8 2v12M2 8h12" opacity=".4"/>
    </svg>
  </button>
</header>

<!-- Hidden file inputs driven from the project menu -->
<input id="import-zip" type="file" accept=".zip,application/zip" hidden>
<input id="import-folder" type="file" webkitdirectory multiple hidden>

<main>
  <!-- ── Left: editor ─────────────────────────────────────────────────────── -->
  <section class="side">
    <div class="bar filebar">
      <div class="filetabs" id="file-bar"></div>
      <button id="add-file" title="Add a file to this model">+ File</button>
      <button id="set-entry" title="Parse starting from this file">Set entry</button>
      <div class="menu-host">
        <button id="snippet-button" title="Insert a YAML snippet at the cursor">Insert ▾</button>
        <div class="menu" id="snippet-menu" hidden></div>
      </div>
      <button id="copy-yaml" title="Copy the open file to the clipboard">Copy</button>
    </div>
    <div class="editor">
      <div id="gutter" class="editor-text" aria-hidden="true">
        <div id="gutter-lines"></div>
      </div>
      <pre id="highlight" class="editor-text" aria-hidden="true"><code id="highlight-code"></code></pre>
      <textarea id="source" class="editor-text" spellcheck="false"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                wrap="off" aria-label="PulseIR model source"></textarea>
    </div>
  </section>

  <!-- ── Right: output ────────────────────────────────────────────────────── -->
  <section class="side">
    <div class="bar">
      <div class="outtabs">
        <button class="tab active" data-tab="sketch">Sketch</button>
        <button class="tab" data-tab="topics">MQTT topics</button>
        <button class="tab" data-tab="libraries">Libraries</button>
        <button class="tab" data-tab="structure">Structure</button>
      </div>
      <div class="spacer"></div>
      <!-- MQTT namespace — only visible when Topics tab is active -->
      <label for="namespace" id="namespace-label" hidden>Namespace</label>
      <input id="namespace" placeholder="project name" hidden>
      <!-- Copy visible pane -->
      <button id="copy-output" title="Copy visible output to clipboard">Copy</button>
      <!-- Download dropdown — enabled only when output exists -->
      <div class="menu-host">
        <button id="download-button" title="Download generated files" disabled>
          ↓ Download ▾
        </button>
        <div class="menu" id="download-menu" hidden>
          <div class="heading">Download</div>
          <button id="download-sketch">Arduino sketch  <span class="sub">.ino</span></button>
          <button id="download-topics">MQTT topics  <span class="sub">topics.json</span></button>
          <button id="download-libraries">Library manifest  <span class="sub">libraries.json</span></button>
        </div>
      </div>
    </div>

    <div class="panes">
      <div class="stale-note" id="stale-note" hidden>

      </div>
