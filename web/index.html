<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseIR Editor</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f7f9;
    --border: #d9dde3;
    --text: #16191d;
    --dim: #6b7280;
    --accent: #0b6bcb;
    --ok-bg: #e7f5ec;
    --ok-fg: #10603a;
    --err-bg: #fdeaea;
    --err-fg: #97231f;
    --warn-bg: #fdf3e2;
    --warn-fg: #7a4b06;
    --code: #f3f4f6;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sel: rgba(11, 107, 203, .20);

    /* Syntax colours. Keys carry the structure, so they lead; comments recede;
       scalars sit between. Checked for contrast on both backgrounds. */
    --y-key: #0a5ea8;
    --y-string: #9b3b16;
    --y-number: #7b3aa8;
    --y-comment: #6b7280;
    --y-anchor: #10603a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1b1f26;
      --border: #2c323c;
      --text: #e6e8eb;
      --dim: #98a1ae;
      --accent: #62aaf5;
      --ok-bg: #12281d;
      --ok-fg: #7fd4a4;
      --err-bg: #2e1618;
      --err-fg: #f6a6a2;
      --warn-bg: #2c2313;
      --warn-fg: #e9c07a;
      --code: #10131a;
      --sel: rgba(98, 170, 245, .26);

      --y-key: #7cc0ff;
      --y-string: #e8a87c;
      --y-number: #d3a2f0;
      --y-comment: #7d8794;
      --y-anchor: #7fd4a4;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  }

  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .spacer { flex: 1; }

  label { color: var(--dim); font-size: 12px; }
  select, input, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  input { width: 13ch; }

  main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    min-height: 0;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

  .side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .side + .side { border-left: 1px solid var(--border); }
  @media (max-width: 900px) { .side + .side { border-left: 0; border-top: 1px solid var(--border); } }

  .bar {
    display: flex; gap: 4px; align-items: center;
    padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .bar .title { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }

  .tab {
    border: 0; background: transparent; color: var(--dim);
    padding: 4px 10px; border-radius: 6px; font-size: 13px;
  }
  .tab.active { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  .filebar { gap: 6px; }
  /* Tabs take the slack and scroll; the buttons must never wrap or shrink. */
  .filetabs { display: flex; gap: 3px; overflow-x: auto; min-width: 0; flex: 1 1 auto; scrollbar-width: thin; }
  .filebar > button { flex: 0 0 auto; white-space: nowrap; }
  .filetab {
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    border: 1px solid transparent; background: transparent; color: var(--dim);
    padding: 3px 8px; border-radius: 6px; font-size: 12.5px;
    font-family: var(--mono); cursor: pointer;
  }
  .filetab:hover { color: var(--text); }
  .filetab.active { background: var(--bg); color: var(--text); border-color: var(--border); }
  .entry-badge { color: var(--accent); font-size: 10px; }
  .filetab .close { color: var(--dim); font-size: 14px; line-height: 1; padding: 0 1px; }
  .filetab .close:hover { color: var(--err-fg); }

  /* The editor is a textarea with its text made transparent, laid over a <pre>
     that draws the same text in colour. Every property that affects glyph
     position has to be identical between the two, or the caret drifts away
     from the characters - hence the shared .editor-text block. */
  .editor {
    flex: 1; position: relative; min-height: 0; background: var(--bg);
  }
  .editor-text {
    margin: 0; border: 0;
    padding: 12px 14px;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    tab-size: 2; white-space: pre; word-wrap: normal; overflow-wrap: normal;
    letter-spacing: normal;
  }
  #source, #highlight {
    position: absolute; inset: 0; width: 100%; height: 100%;
    box-sizing: border-box;
    /* Room for the gutter. Sized in ch, so it grows with the line count and
       stays exact in a monospace font. */
    padding-left: var(--gutter-width, 14px);
  }

  /* Line numbers. Their own layer, scrolled vertically with the text but never
     horizontally - the numbers stay put while a long line scrolls past. */
  #gutter {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: var(--gutter-width, 0);
    overflow: hidden;
    padding-left: 0; padding-right: 10px;
    text-align: right;
    color: var(--dim); opacity: .65;
    background: var(--bg);
    border-right: 1px solid var(--border);
    pointer-events: none;
    /* Numbers must never end up in a copied selection. */
    user-select: none; -webkit-user-select: none;
  }
  #gutter .ln { display: block; }
  /* The line the parser objected to. The status bar names it; this is how you
     find it without counting. */
  #gutter .ln.bad {
    color: var(--err-fg); opacity: 1; font-weight: 600;
    background: var(--err-bg);
  }
  #highlight {
    overflow: hidden;                 /* content is translated, never scrolled */
    pointer-events: none;
    color: var(--text);
  }
  /* The inner <code> must add nothing of its own; every metric comes from the
     .editor-text block the textarea also uses.
     It is moved with a transform rather than by scrolling its parent: a
     parent's scrollTop is clamped to its own scrollHeight - clientHeight, and
     the textarea's client box is shorter whenever it shows a scrollbar that
     takes up space. A transform has no such limit, so the two can never
     disagree. */
  #highlight code, #gutter-lines {
    display: block; font: inherit; line-height: inherit; letter-spacing: inherit;
    white-space: inherit; tab-size: inherit; color: inherit;
    will-change: transform;
  }
  textarea#source {
    resize: none; outline: none; background: transparent;
    color: transparent; caret-color: var(--text);
    overflow: auto;
  }
  /* With transparent text, selection shows as a bare rectangle; the coloured
     text underneath stays readable through it. */
  #source::selection { background: var(--sel, rgba(120, 160, 255, .28)); }

  .y-key     { color: var(--y-key); }
  .y-string  { color: var(--y-string); }
  .y-number  { color: var(--y-number); }
  .y-boolean { color: var(--y-number); }
  .y-null    { color: var(--y-number); }
  .y-comment { color: var(--y-comment); font-style: italic; }
  .y-punct   { color: var(--dim); }
  .y-anchor  { color: var(--y-anchor); }
  .y-tag     { color: var(--y-anchor); }

  /* Project menu. A plain popup - no framework, and it has to work offline. */
  .menu-host { position: relative; }
  #project-button { font-family: var(--mono); font-size: 12.5px; max-width: 26ch; }
  /* Unconstrained, the template list stretches and wraps the header. */
  #example { max-width: 24ch; }
  #project-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .caret { color: var(--dim); }
  .menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
    min-width: 250px; max-height: 70vh; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18); padding: 4px;
  }
  .menu button {
    display: flex; width: 100%; gap: 8px; align-items: baseline;
    border: 0; background: transparent; text-align: left;
    padding: 6px 9px; border-radius: 6px; font-size: 13px;
  }
  .menu button:hover:not(:disabled) { background: var(--panel); color: var(--text); }
  .menu button .sub { color: var(--dim); font-size: 11.5px; margin-left: auto; }
  .menu .sep { height: 1px; background: var(--border); margin: 4px 2px; }
  .menu .heading {
    padding: 6px 9px 2px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--dim);
  }
  .menu button.current { color: var(--accent); font-weight: 600; }
  .menu button.danger:hover { background: var(--err-bg); color: var(--err-fg); }

  /* Copy buttons confirm in place: a toast would be more machinery than the
     feedback is worth. */
  #copy-yaml, #copy-output { flex: 0 0 auto; font-size: 12.5px; padding: 3px 9px; }
  button.copied { color: var(--ok-fg); border-color: var(--ok-fg); }

  /* Dropping a folder or a zip anywhere on the page imports it. */
  body.dropping::after {
    content: 'Drop a model folder or .zip to import';
    position: fixed; inset: 12px; z-index: 50; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--accent); border-radius: 12px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    color: var(--accent); font-size: 15px;
  }

  .panes { flex: 1; overflow: auto; min-height: 0; }
  .stale-note {
    position: sticky; top: 0; z-index: 1;
    padding: 6px 14px; font-size: 12.5px;
    background: var(--err-bg); color: var(--err-fg);
    border-bottom: 1px solid var(--border);
  }
  .pane { padding: 12px 14px; }
  .pane.stale { opacity: .45; }
  pre { margin: 0; }
  /* Scoped to the output panes: this used to be a bare `pre code`, which also
     hit the editor's colour layer and shrank it out of step with the textarea
     it has to sit exactly beneath. */
  .pane pre code {
    display: block; font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    white-space: pre; color: var(--text);
  }
  code { font-family: var(--mono); font-size: 12.5px; }

  .status {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    padding: 7px 14px; border-top: 1px solid var(--border); font-size: 13px;
  }
  .status.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .status.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .status.error { background: var(--err-bg); color: var(--err-fg); }
  .status span { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }

  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--dim); margin: 18px 0 6px; }
  h3:first-child { margin-top: 0; }
  .hint { color: var(--dim); font-size: 12.5px; margin: 0 0 10px; }
  .dim { color: var(--dim); }

  .state {
    border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 9px; margin: 5px 0; background: var(--bg);
  }
  .state.composite { background: var(--panel); }
  .state.leaf { display: flex; gap: 7px; align-items: center; }
  .state-name { display: flex; gap: 7px; align-items: center; font-weight: 500; }
  .children { margin: 6px 0 2px 14px; border-left: 2px solid var(--border); padding-left: 10px; }
  .initial { color: var(--accent); font-weight: 700; }
  .tag {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px;
  }
  .tag.wild { color: var(--accent); border-color: var(--accent); }
  .tag.timer { color: var(--warn, var(--dim)); }
  .arrow { color: var(--accent); }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>

<header>
  <h1>PulseIR <span>editor</span></h1>

  <div class="menu-host">
    <button id="project-button" aria-haspopup="true" aria-expanded="false">
      <span id="project-name">—</span> <span class="caret">▾</span>
    </button>
    <div class="menu" id="project-menu" hidden></div>
  </div>

  <label for="example">New from</label>
  <select id="example"><option value="">—</option></select>

  <label for="namespace">MQTT namespace</label>
  <input id="namespace" placeholder="project name">

  <div class="spacer"></div>

  <button id="download-sketch">Download .ino</button>
  <button id="download-topics">topics.json</button>
  <button id="download-libraries">libraries.json</button>
</header>

<!-- Import needs a real file input; kept out of the way and driven from the
     project menu. `webkitdirectory` is what lets a whole folder be picked. -->
<input id="import-zip" type="file" accept=".zip,application/zip" hidden>
<input id="import-folder" type="file" webkitdirectory multiple hidden>

<main>
  <section class="side">
    <div class="bar filebar">
      <div class="filetabs" id="file-bar"></div>
      <button id="add-file" title="Add a file to this model">+ File</button>
      <button id="set-entry" title="Parse starting from the open file">Set entry</button>
      <button id="copy-yaml" title="Copy this file to the clipboard">Copy</button>
    </div>
    <div class="editor">
      <div id="gutter" class="editor-text" aria-hidden="true"><div id="gutter-lines"></div></div>
      <pre id="highlight" class="editor-text" aria-hidden="true"><code id="highlight-code"></code></pre>
      <textarea id="source" class="editor-text" spellcheck="false" autocomplete="off"
                autocorrect="off" autocapitalize="off" wrap="off"
                aria-label="PulseIR model source"></textarea>
    </div>
  </section>

  <section class="side">
    <div class="bar">
      <button class="tab active" data-tab="sketch">Arduino sketch</button>
      <button class="tab" data-tab="topics">MQTT topics</button>
      <button class="tab" data-tab="libraries">Libraries</button>
      <button class="tab" data-tab="structure">Structure</button>
      <div class="spacer"></div>
      <button id="copy-output" title="Copy the visible pane to the clipboard">Copy</button>
    </div>
    <div class="panes">
      <div class="stale-note" id="stale-note" hidden>
        Showing the last valid output — fix the error below to update.
      </div>
      <div class="pane" id="pane-sketch"></div>
      <div class="pane" id="pane-topics" hidden></div>
      <div class="pane" id="pane-libraries" hidden></div>
      <div class="pane" id="pane-structure" hidden></div>
    </div>
  </section>
</main>

<div class="status ok" id="status"><strong>Loading…</strong></div>

<script src="./app.js"></script>
</body>
</html>
